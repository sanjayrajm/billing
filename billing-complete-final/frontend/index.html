<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>muthuganesan Textiles — Billing App</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1976d2"/>
<style>
/* Responsive CSS - mobile-first (condensed) */
:root{--bg:#f7f9fc;--panel:#eaf0fb;--accent:#1976d2;--text:#1f2937;--muted:#6b7280;--card-radius:10px}
body { margin:0; font-family: "Segoe UI", Roboto, Arial, sans-serif; background:var(--bg); color:var(--text); }
.header{display:flex;align-items:center;padding:12px;background:var(--panel);gap:12px;flex-wrap:wrap}
.brand{font-weight:700}
.container{display:flex;gap:12px;padding:12px;flex-wrap:wrap}
.left{flex:1;min-width:300px}
.right{width:360px;min-width:260px}
.card{background:var(--panel);border-radius:var(--card-radius);padding:12px;box-shadow:0 1px 0 rgba(0,0,0,0.02)}
.tabs{display:flex;gap:8px;margin-bottom:8px}
.tab{padding:8px 10px;border-radius:8px;cursor:pointer}
.tab.active{background:var(--accent);color:white}
.input, input, select{width:100%;padding:10px;border-radius:8px;border:1px solid rgba(0,0,0,0.08);font-size:14px}
.button{background:var(--accent);color:white;border:none;padding:10px 12px;border-radius:8px;cursor:pointer}
.small{padding:6px 8px}
.table-wrapper{overflow:auto;background:white;border-radius:8px}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;border-bottom:1px solid #eee;text-align:left}
.preview{white-space:pre;font-family:monospace;background:white;padding:12px;border-radius:8px;height:360px;overflow:auto}
@media (max-width:900px){ .container{flex-direction:column} .right{width:100%} }
</style>

<script>/* Sentry frontend stub - set SENTRY_DSN in env and include script in production */
(function(){var dsn='__SENTRY_DSN__'; if(dsn && dsn.length>5){var s=document.createElement('script');s.src='https://browser.sentry-cdn.com/7.0.0/bundle.min.js';document.head.appendChild(s);}}
)();</script>
</head>
<body>
  <div class="header">
    <div>
      <div class="brand">muthuganesan Textiles</div>
      <div style="font-size:13px;color:var(--muted)">103 b kamachiamman sanathi street kanchipuram • 04447791355</div>
    </div>
    <div style="margin-left:auto;display:flex;gap:8px">
      <button id="loginBtn" class="button small">Login</button>
      <button id="syncBtn" class="small">Sync</button>
    </div>
  </div>

  <div class="container">
    <div class="left">
      <div class="tabs">
        <div class="tab active" data-tab="billingTab">🧾 Billing</div>
        <div class="tab" data-tab="printTab">🖨 Print</div>
        <div class="tab" data-tab="productsTab">📦 Products</div>
      </div>

      <div id="billingTab" class="card">
        <div style="display:flex;gap:12px;flex-wrap:wrap">
          <input id="custName" class="input" placeholder="Customer name" value="Customer" style="flex:1"/>
          <input id="custPhone" class="input" placeholder="Phone" style="width:200px"/>
        </div>

        <hr>

        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">
          <div style="flex:1;min-width:180px">
            <label>Item</label>
            <input id="itemName" class="input" placeholder="Type to search products" />
            <div id="suggestions" style="background:white;border:1px solid #eee;border-radius:8px;max-height:180px;overflow:auto;display:none"></div>
          </div>
          <div style="width:100px">
            <label>MRP</label><input id="itemMrp" type="number" class="input"/>
          </div>
          <div style="width:100px"><label>Rate</label><input id="itemRate" type="number" class="input"/></div>
          <div style="width:80px"><label>Disc%</label><input id="itemDisc" type="number" class="input"/></div>
          <div style="width:80px"><label>Qty</label><input id="itemQty" type="number" value="1" class="input"/></div>
          <div style="width:120px"><button id="addItem" class="button">Add</button></div>
        </div>

        <div style="margin-top:12px" class="table-wrapper card">
          <table id="itemsTable"><thead><tr><th>Item</th><th>MRP</th><th>Rate</th><th>Disc%</th><th>Qty</th><th>Total</th><th>Actions</th></tr></thead><tbody></tbody></table>
        </div>

        <div style="display:flex;gap:12px;align-items:center;margin-top:8px;flex-wrap:wrap">
          <div>
            <label>GST %</label><input id="gst" class="input" type="number" value="18"/>
          </div>
          <div style="margin-left:auto;text-align:right">
            <div>Subtotal: ₹ <span id="subtotal">0.00</span></div>
            <div>GST: ₹ <span id="gstVal">0.00</span></div>
            <div style="font-weight:700;">Total: ₹ <span id="total">0.00</span></div>
            <div>Paid: <input id="paid" type="number" value="0" style="width:120px"/></div>
            <div>Due: ₹ <span id="due">0.00</span></div>
            <div style="margin-top:8px"><button id="printPreviewBtn" class="button">Preview</button> <button id="savePdfBtn" class="button">Save PDF</button></div>
          </div>
        </div>
      </div>

      <div id="printTab" class="card" style="display:none">
        <div style="display:flex;justify-content:space-between">
          <b>Print Preview</b>
          <div><button id="printBtn" class="button small">Print</button> <button id="backBtn" class="small">Back</button></div>
        </div>
        <div id="printPreview" class="preview" style="margin-top:8px"></div>
      </div>

      <div id="productsTab" class="card" style="display:none">
        <div style="display:flex;gap:8px;align-items:center">
          <input id="prodSearch" class="input" placeholder="Search product" />
          <button id="importCsv" class="small">Import CSV</button>
          <button id="exportCsv" class="small">Export CSV</button>
        </div>

        <div style="display:flex;gap:12px;margin-top:10px;flex-wrap:wrap">
          <div style="flex:1;min-width:200px">
            <div id="productList" style="background:white;border-radius:8px;padding:6px;max-height:320px;overflow:auto"></div>
          </div>
          <div style="width:360px;min-width:260px">
            <input id="p_sku" class="input" placeholder="SKU"/>
            <input id="p_name" class="input" placeholder="Name"/>
            <input id="p_cat" class="input" placeholder="Category"/>
            <input id="p_brand" class="input" placeholder="Brand"/>
            <div style="display:flex;gap:8px">
              <input id="p_mrp" type="number" class="input" placeholder="MRP"/>
              <input id="p_rate" type="number" class="input" placeholder="Rate"/>
            </div>
            <div style="display:flex;gap:8px">
              <input id="p_discount" type="number" class="input" placeholder="Discount%"/>
              <input id="p_qty" type="number" class="input" placeholder="Qty"/>
            </div>
            <label>Image</label><input id="p_image" type="file" accept="image/*"/>
            <div id="p_preview"></div>
            <div style="display:flex;gap:8px">
              <button id="saveProduct" class="button">Save</button>
              <button id="deleteProduct" class="small">Delete</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="right">
      <div class="card">
        <h4>Quick Tools</h4>
        <div style="display:flex;flex-direction:column;gap:8px">
          <button id="reloadProducts" class="small">Reload Products</button>
          <button id="exportProductsJson" class="small">Export Products JSON</button>
          <button id="importProductsJson" class="small">Import Products JSON</button>
        </div>
      </div>

      <div class="card">
        <h4>Backup</h4>
        <button id="downloadApp" class="small">Download App JSON</button>
        <input id="uploadApp" type="file" accept="application/json" style="display:none"/>
      </div>

      <div class="card">
        <h4>Auth</h4>
        <div id="authArea">
          <div id="loggedOut">
            <small>Not logged in</small>
          </div>
          <div id="loggedIn" style="display:none">
            <small>Logged in as <span id="who"></span></small>
            <div style="margin-top:6px"><button id="logout" class="small">Logout</button></div>
          </div>
        </div>
      </div>
    </div>

  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
